name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    env:
      DATA_LAYER: memory
      SESSION_SECRET: test-session-secret-key-at-least-32-chars-long
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: 1. ESLint Check
        run: npm run lint

      - name: 2. TypeScript Compiler Check
        run: npm run typecheck

      - name: 3. Unit, Contract & Integration Tests
        run: npm test

      - name: 4. 5,000-Record Performance Benchmark
        run: npm run test:perf

      - name: 5. Next.js Production Build
        run: npm run build
